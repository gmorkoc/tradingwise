<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:#fff;gap:16px">
  <h2 style="margin-bottom:8px;color:#38bdf8">🔔 Alert Sound Previews</h2>

  <button onclick="fireAlarm()" style="padding:18px 36px;font-size:1rem;border-radius:12px;border:none;background:#ef4444;color:#fff;cursor:pointer;font-weight:700;width:280px">
    🔥 1. Fire Alarm
  </button>

  <button onclick="siren()" style="padding:18px 36px;font-size:1rem;border-radius:12px;border:none;background:#f97316;color:#fff;cursor:pointer;font-weight:700;width:280px">
    🚨 2. Emergency Siren
  </button>

  <button onclick="klaxon()" style="padding:18px 36px;font-size:1rem;border-radius:12px;border:none;background:#8b5cf6;color:#fff;cursor:pointer;font-weight:700;width:280px">
    ⚠️ 3. Klaxon
  </button>

  <button onclick="dramaticSting()" style="padding:18px 36px;font-size:1rem;border-radius:12px;border:none;background:#06b6d4;color:#0f172a;cursor:pointer;font-weight:700;width:280px">
    🎬 4. Dramatic Sting
  </button>

  <button onclick="stockBell()" style="padding:18px 36px;font-size:1rem;border-radius:12px;border:none;background:#38bdf8;color:#0f172a;cursor:pointer;font-weight:700;width:280px">
    🔔 5. Stock Exchange Bell
  </button>

  <script>
    function fireAlarm() {
      const ctx = new AudioContext();
      const t0 = ctx.currentTime;
      for (let i = 0; i < 6; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = "square";
        osc.frequency.setValueAtTime(i % 2 === 0 ? 960 : 800, t0 + i * 0.18);
        gain.gain.setValueAtTime(0, t0 + i * 0.18);
        gain.gain.linearRampToValueAtTime(0.4, t0 + i * 0.18 + 0.01);
        gain.gain.setValueAtTime(0.4, t0 + i * 0.18 + 0.13);
        gain.gain.linearRampToValueAtTime(0, t0 + i * 0.18 + 0.16);
        osc.start(t0 + i * 0.18);
        osc.stop(t0 + i * 0.18 + 0.16);
      }
    }

    function siren() {
      const ctx = new AudioContext();
      const t0 = ctx.currentTime;
      for (let i = 0; i < 2; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = "sawtooth";
        const t = t0 + i * 0.7;
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.exponentialRampToValueAtTime(1200, t + 0.35);
        osc.frequency.exponentialRampToValueAtTime(400, t + 0.7);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
        gain.gain.setValueAtTime(0.3, t + 0.62);
        gain.gain.linearRampToValueAtTime(0, t + 0.7);
        osc.start(t); osc.stop(t + 0.7);
      }
    }

    function klaxon() {
      const ctx = new AudioContext();
      const t0 = ctx.currentTime;
      const freqs = [220, 180, 220, 180, 220];
      freqs.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, t0 + i * 0.2);
        gain.gain.setValueAtTime(0, t0 + i * 0.2);
        gain.gain.linearRampToValueAtTime(0.45, t0 + i * 0.2 + 0.01);
        gain.gain.setValueAtTime(0.45, t0 + i * 0.2 + 0.16);
        gain.gain.linearRampToValueAtTime(0, t0 + i * 0.2 + 0.19);
        osc.start(t0 + i * 0.2); osc.stop(t0 + i * 0.2 + 0.2);
      });
    }

    function dramaticSting() {
      const ctx = new AudioContext();
      const t0 = ctx.currentTime;

      const bass = ctx.createOscillator();
      const bassGain = ctx.createGain();
      bass.connect(bassGain); bassGain.connect(ctx.destination);
      bass.type = "sine";
      bass.frequency.setValueAtTime(55, t0);
      bass.frequency.exponentialRampToValueAtTime(110, t0 + 0.6);
      bassGain.gain.setValueAtTime(0, t0);
      bassGain.gain.linearRampToValueAtTime(0.5, t0 + 0.05);
      bassGain.gain.setValueAtTime(0.5, t0 + 0.55);
      bassGain.gain.linearRampToValueAtTime(0, t0 + 0.65);
      bass.start(t0); bass.stop(t0 + 0.65);

      const sweep = ctx.createOscillator();
      const sweepGain = ctx.createGain();
      sweep.connect(sweepGain); sweepGain.connect(ctx.destination);
      sweep.type = "sawtooth";
      sweep.frequency.setValueAtTime(200, t0 + 0.1);
      sweep.frequency.exponentialRampToValueAtTime(1600, t0 + 0.7);
      sweepGain.gain.setValueAtTime(0, t0 + 0.1);
      sweepGain.gain.linearRampToValueAtTime(0.25, t0 + 0.2);
      sweepGain.gain.setValueAtTime(0.25, t0 + 0.65);
      sweepGain.gain.linearRampToValueAtTime(0, t0 + 0.72);
      sweep.start(t0 + 0.1); sweep.stop(t0 + 0.72);

      const sting = ctx.createOscillator();
      const stingGain = ctx.createGain();
      sting.connect(stingGain); stingGain.connect(ctx.destination);
      sting.type = "square";
      sting.frequency.setValueAtTime(1400, t0 + 0.7);
      sting.frequency.exponentialRampToValueAtTime(900, t0 + 1.1);
      stingGain.gain.setValueAtTime(0, t0 + 0.7);
      stingGain.gain.linearRampToValueAtTime(0.4, t0 + 0.72);
      stingGain.gain.exponentialRampToValueAtTime(0.001, t0 + 1.1);
      sting.start(t0 + 0.7); sting.stop(t0 + 1.1);
    }

    function stockBell() {
      const ctx = new AudioContext();
      const t0 = ctx.currentTime;

      function bell(freq, t, vol = 0.4) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc2.connect(gain2); gain2.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
        osc.start(t); osc.stop(t + 2.2);
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(freq * 2.756, t);
        gain2.gain.setValueAtTime(vol * 0.4, t);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
        osc2.start(t); osc2.stop(t + 1.0);
      }

      const click = ctx.createOscillator();
      const clickGain = ctx.createGain();
      click.connect(clickGain); clickGain.connect(ctx.destination);
      click.type = "square";
      click.frequency.setValueAtTime(800, t0);
      clickGain.gain.setValueAtTime(0.3, t0);
      clickGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.02);
      click.start(t0); click.stop(t0 + 0.02);

      bell(987, t0);
      bell(830, t0 + 0.18, 0.3);
      bell(659, t0 + 0.34, 0.2);
    }
  </script>
</body>
</html>
